components:
  terraform:
    ipam/disabled:
      metadata:
        component: target
      vars:
        enabled: false
        # account-map lives in the test stack ({tenant}-{stage} = default-test),
        # not the component's default "root" stage.
        account_map_stage_name: test
        operating_regions:
          - us-east-2
        pools:
          top:
            cidrs:
              primary:
                cidr: "10.251.0.0/16"
