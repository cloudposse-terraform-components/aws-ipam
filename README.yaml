name: "aws-ipam"
# Canonical GitHub repo
github_repo: "cloudposse-terraform-components/aws-ipam"
# Short description of this project
description: |-
  This component is responsible for provisioning IPAM per region in a centralized account.
usage: |-
  **Stack Level**: Regional

  This component wraps the [`cloudposse/terraform-aws-ipam`](https://github.com/cloudposse/terraform-aws-ipam)
  module, which takes IPAM pools as a **flat `pools` map** keyed by your own name
  for each pool. Hierarchy is expressed by a pool naming another entry as its
  `parent` (rather than the old nested `pool_configurations` / `sub_pools`). Pool
  nesting is capped at a depth of 4.

  Provisioned CIDRs go under a pool's `cidrs`, manual reservations under
  `allocations`, and RAM sharing under `ram_share`. As a convenience, an entry in
  `ram_share.principals` that matches an `account-map` account name is resolved to
  that account's ID; literal account IDs and ARNs pass through, and the current
  account is dropped (RAM cannot share a resource with its own owner).

  Here's an example snippet for how to use this component.

  ```yaml
  components:
    terraform:
      ipam:
        vars:
          enabled: true
          pools:
            core:
              cidrs:
                primary:
                  cidr: 10.96.0.0/12
            core-network:
              parent: core
              locale: us-east-2
              cidrs:
                primary:
                  cidr: 10.96.0.0/16
              ram_share:
                principals: [core-network]
            core-auto:
              parent: core
              locale: us-east-2
              cidrs:
                primary:
                  cidr: 10.97.0.0/16
              ram_share:
                principals: [core-auto]
            plat:
              cidrs:
                primary:
                  cidr: 10.112.0.0/12
            plat-dev:
              parent: plat
              locale: us-east-2
              cidrs:
                primary:
                  cidr: 10.112.0.0/16
              ram_share:
                principals: [plat-dev]
            plat-prod:
              parent: plat
              locale: us-east-2
              cidrs:
                primary:
                  cidr: 10.114.0.0/16
              ram_share:
                principals: [plat-prod]
  ```

